# ─── MantaRay AI — Docker Compose ────────────────────────────────────────────
# Škoda Auto India · AI Calling Agent — Full Stack
#
# Usage:
#   docker compose up --build          first time / after code changes
#   docker compose up -d               background (detached)
#   docker compose down                stop all containers
#   docker compose logs -f backend     tail backend logs
#   docker compose logs -f frontend    tail frontend logs
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in all values
#   2. Ensure PUBLIC_BASE_URL points to a publicly reachable HTTPS URL
#      (use ngrok: `ngrok http 8000` then set the https URL)

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mantaray-backend:latest
    container_name: mantaray-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ElevenLabs Conversational Agent
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      # Twilio outbound calling
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      # Razorpay (optional)
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      # Python runtime
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mantaray-net
    labels:
      - "com.mantaray.service=backend"
      - "com.mantaray.version=3.0.0"

  # ── React Frontend (Nginx, production build) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty — nginx proxies /api and /ws to the backend container
        VITE_API_URL: ""
    image: mantaray-frontend:latest
    container_name: mantaray-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mantaray-net
    labels:
      - "com.mantaray.service=frontend"
      - "com.mantaray.version=3.0.0"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  mantaray-net:
    name: mantaray-network
    driver: bridge
