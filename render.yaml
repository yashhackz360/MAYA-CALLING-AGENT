services:
  - type: web
    name: mantaray-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: XAI_API_KEY
        sync: false

